# Single source of truth for paths, models and thresholds.
paths:
  data_root: ~/da3ft-data/rellis
  cache_root: ~/da3ft-data/cache
  results_root: results
  checkpoint_root: ~/da3ft-data/checkpoints

upstream:
  da3_commit: 3d835ec1a5802d64a8b8b15f817a1ab54809bfe4

models:
  da3_small: depth-anything/DA3-SMALL
  da3_base: depth-anything/DA3-BASE
  da2_small: depth-anything/Depth-Anything-V2-Small-hf
  da2_base: depth-anything/Depth-Anything-V2-Base-hf

# upper_bound_resize turns 1920x1200 into 504x315, and the tie at 315 rounds up to 322.
input:
  width: 504
  height: 322
  process_res: 504
  method: upper_bound_resize

seed: 0

lora:
  rank: 8
  target_regex: '.*blocks\.\d+\.attn\.(qkv|proj)'

phase0:
  batch_sizes: [2, 4]
  modes: [head, lora, full]
  latency_warmup: 5
  latency_runs: 30

# Fixed before any training; see DECISIONS.md for the rule.
split:
  train: ["00000", "00003", "00004"]
  val: "00001"
  test: "00002"
  eval_stride: 5

gt:
  sequences: ["00000", "00001", "00002", "00003", "00004"]
  # Only in RELLIS-3D's utils/lidar2img.ipynb; camera_info.txt has no distortion terms.
  distortion: [-0.134313, -0.025905, 0.002181, 0.00084, 0.0]
  source_size: [1920, 1200]
  # Primary ground truth uses the official calibration; these estimates are for sensitivity only.
  sensitivity_calibration: results/calibration_estimates.yaml
  # Rule fixed before looking: drop only frames visibly misaligned beyond the known global offset.
  # Checked 2026-11-03: none qualified.
  dropped_frames: {}
  # Fixed before fitting. Person is excluded: its labels barely overlap between sources.
  refinement:
    classes: [5, 8, 18, 23, 27] # pole, vehicle, fence, concrete, barrier
    radius: 14
    block: 50
    resamples: 300
    max_ci_width: 3.0
    min_points: 2000
  occlusion:
    radius_x: 4
    radius_y: 4
    rel_threshold: 0.2
    abs_threshold: 0.5

rellis:
  expected_images:
    "00000": 2847
    "00001": 2319
    "00002": 4147
    "00003": 2184
    "00004": 2059

# Phase 2 evaluation. Every value is fixed on val before any test number exists; frozen: true
# (in a clean commit) is required before scripts/eval.py will touch the test split.
eval:
  min_depth: 1.0 # val GT: nothing below 3.4 m
  max_depth: 80.0 # val GT: 0.008% of points beyond
  min_valid: 200 # pixels needed before any alignment fit
  min_subset_px: 50 # val GT: edge_depth has a median of 71 px per image; N images is reported
  edge_k: 4 # columns either side; median spacing along a ring is 2 px
  edge_tau: 0.2 # depth jump, the same as the occlusion filter's rel_threshold
  distance_bins: [0, 10, 20, 80] # val GT: 62%, 29%, 9%
  high_error: 0.25 # per-pixel AbsRel that counts as an error for AUROC
  auroc_min_class: 20
  phantom_ratio: 0.8
  overshoot_ratio: 1.25
  sparsification_step: 0.05
  sparsification_max: 0.95
  sobel_thickness: [3, 5, 9] # faithful Otsu mask; removes 73-86% of valid pixels on val
  # Primary filtering comparison: remove a fixed share of valid pixels, ranked by Sobel score,
  # lowest confidence or at random. The rank uses the primary kernel diameter.
  filter_budgets: [0.1, 0.2, 0.3, 0.5]
  sobel_rank_thickness: 5
  random_filter_seeds: 10
  # Block of 30 evaluated frames (about 15 s): val per-image AbsRel stays correlated to lag ~20-30.
  bootstrap: {block: 30, resamples: 1000, seed: 0}
  reference_model: da3_small # paired differences are reported against this model
  frozen: true # 2026-11-03, before any test number

# Phase 3 fine-tuning. Fixed 2026-11-06 before any training run; see DECISIONS.md. Selection uses
# val only: mean per-image AbsRel over all valid pixels, median alignment, official GT.
train:
  base_model: da3_small
  teacher: pred/da3_small # cached by scripts/infer.py --split train --stride 1
  batch: 4
  accumulate: 2 # effective batch 8
  num_workers: 6
  epochs: 20 # also the length of the cosine schedule
  patience: 3
  warmup_steps: 300 # optimiser steps
  weight_decay: 0.01
  grad_clip: 1.0
  lr_head: 5.0e-5 # the head's rate in every mode; a run's lr is for the LoRA parameters
  lambda_c: 1.0 # not in the DA3 paper; must stay above eval.high_error
  distill_space: linear # scripts/diagnostics/distill_space.py: far-10% share 0.187 < 0.3
  flip_p: 0.5
  jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}
  selection: absrel_all
  # Run by scripts/phase3_runs.py in order. "best" takes the value of the best run selected so far.
  stages:
    - name: S1 # LoRA learning rate
      select: true
      runs:
        - {mode: lora, lr: 5.0e-5, lambda_d: 0.5}
        - {mode: lora, lr: 1.0e-4, lambda_d: 0.5}
        - {mode: lora, lr: 2.0e-4, lambda_d: 0.5}
    - name: S2 # distillation weight; 0.5 reuses its S1 run
      select: true
      runs:
        - {mode: lora, lr: best, lambda_d: 0.1}
        - {mode: lora, lr: best, lambda_d: 0.5}
        - {mode: lora, lr: best, lambda_d: 1.0}
    - name: S3 # head-only, no-distillation ablation, extra seeds of the main model
      select: false
      runs:
        - {mode: head, lambda_d: best}
        - {mode: lora, lr: best, lambda_d: 0.0}
        - {mode: lora, lr: best, lambda_d: best, seed: 1}
        - {mode: lora, lr: best, lambda_d: best, seed: 2}
